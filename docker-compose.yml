services:
  backend:
    image: rsargsyan/metafilm-backend:latest
    ports:
      - "${BACKEND_PORT:-8092}:8080"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      ADMIN_FIREBASE_PROJECT_ID: ${ADMIN_FIREBASE_PROJECT_ID}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_REGION: ${S3_REGION:-eu-central-003}
      S3_ENDPOINT: ${S3_ENDPOINT:-https://s3.eu-central-003.backblazeb2.com}
      S3_BUCKET: ${S3_BUCKET}
      TMDB_API_KEY: ${TMDB_API_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "minio.local:host-gateway"
    restart: unless-stopped

  admin-ui:
    image: rsargsyan/metafilm-admin-ui:latest
    ports:
      - "${ADMIN_UI_PORT:-5179}:80"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      VITE_ADMIN_FIREBASE_API_KEY: ${VITE_ADMIN_FIREBASE_API_KEY}
      VITE_ADMIN_FIREBASE_AUTH_DOMAIN: ${VITE_ADMIN_FIREBASE_AUTH_DOMAIN}
      VITE_ADMIN_FIREBASE_PROJECT_ID: ${VITE_ADMIN_FIREBASE_PROJECT_ID}
      VITE_ADMIN_FIREBASE_STORAGE_BUCKET: ${VITE_ADMIN_FIREBASE_STORAGE_BUCKET}
      VITE_ADMIN_FIREBASE_MESSAGING_SENDER_ID: ${VITE_ADMIN_FIREBASE_MESSAGING_SENDER_ID}
      VITE_ADMIN_FIREBASE_APP_ID: ${VITE_ADMIN_FIREBASE_APP_ID}
    restart: unless-stopped

  web-ui:
    image: rsargsyan/metafilm-web-ui:latest
    ports:
      - "${WEB_UI_PORT:-5180}:80"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
      VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
      VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
      VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
      VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
    restart: unless-stopped
